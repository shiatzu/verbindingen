<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Woordverbindingen Spel</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --tile-default: #efefe6;
            --tile-selected: #5a5a5a;
            --tile-selected-text: #ffffff;
            --cat-0: #f9df6d; /* Geel */
            --cat-1: #a0c35a; /* Groen */
            --cat-2: #b0c4de; /* Blauw */
            --cat-3: #ba55d3; /* Paars */
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            margin-bottom: 5px;
        }

        .instructions {
            color: #666;
            margin-bottom: 15px;
            text-align: center;
        }

        #game-container {
            max-width: 600px;
            width: 100%;
            margin-top: 20px;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .tile {
            aspect-ratio: 1 / 1;
            background-color: var(--tile-default);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s, color 0.2s;
            text-align: center;
            padding: 5px;
        }

        .tile.selected {
            background-color: var(--tile-selected);
            color: var(--tile-selected-text);
        }

        .solved-row {
            grid-column: span 4;
            height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-weight: bold;
            animation: popIn 0.3s ease-out;
        }

        .solved-row .category-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .solved-row .category-words {
            font-size: 12px;
            font-weight: normal;
            opacity: 0.9;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            background-color: transparent;
            border: 1px solid #ccc;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background-color: #f5f5f5;
        }

        #message {
            font-weight: bold;
