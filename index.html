<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verbindingen</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f5f4f0;color:#1a1a1a;min-height:100vh;display:flex;justify-content:center;padding:1.5rem 1rem}
#app{width:100%;max-width:600px}
h1{font-size:26px;font-weight:600;text-align:center;margin-bottom:0.25rem}
.sub{font-size:15px;color:#666;text-align:center;margin-bottom:1rem}
.puzzle-nr{font-size:14px;color:#888;text-align:center;margin-bottom:0.75rem}
.lives{display:flex;gap:6px;justify-content:center;margin-bottom:1rem;font-size:22px}
.msg{min-height:26px;text-align:center;font-size:15px;font-weight:500;margin-bottom:0.5rem}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem}
.tile{padding:12px 6px;border-radius:8px;border:2px solid #ccc;background:#fff;cursor:pointer;text-align:center;font-size:15px;font-weight:500;color:#1a1a1a;transition:background 0.15s,border-color 0.15s,transform 0.1s;user-select:none;min-height:64px;display:flex;align-items:center;justify-content:center;word-break:break-word;line-height:1.2}
.tile:hover{border-color:#888;background:#f0f0f0}
.tile.sel{border-color:#534AB7;background:#EEEDFE;color:#3C3489}
.tile.shake{animation:shake 0.4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.solved-row{border-radius:8px;padding:14px 16px;margin-bottom:8px;display:flex;flex-direction:column;gap:3px}
.solved-row .cat-label{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px}
.solved-row .cat-words{font-size:15px}
.cat-0{background:#f9df6d;color:#7A6800}
.cat-1{background:#a0c35a;color:#2a4a00}
.cat-2{background:#b0c4de;color:#0A3A6E}
.cat-3{background:#ba55d3;color:#fff}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:0.5rem}
.btns button{font-size:14px;padding:8px 18px;border-radius:6px;border:1.5px solid #bbb;background:#fff;cursor:pointer;font-weight:500;transition:background 0.15s}
.btns button:hover{background:#f0f0f0}
.btn-primary{background:#000!important;color:#fff!important;border-color:#000!important}
.btn-primary:hover{background:#333!important}
#solved-area{margin-bottom:8px}
</style>
</head>
<body>
<div id="app">
  <h1>Verbindingen</h1>
  <p class="sub">Vind vier woorden die bij elkaar horen</p>
  <div class="puzzle-nr" id="puzzle-nr"></div>
  <div class="lives" id="lives"></div>
  <div class="msg" id="msg"></div>
  <div id="solved-area"></div>
  <div class="grid" id="grid"></div>
  <div class="btns" id="btns"></div>
</div>

<script>
const PUZZLES = [
  {
    title:"Puzzel 1",
    categories:[
      {id:0, name:"Dingen die (vaak) geel zijn", words:["Banaan","Taxi","Kanarie","Badeend"]},
      {id:1, name:"Onvrijwillige acties", words:["Niezen","Blozen","Braken","Hoesten"]},
      {id:2, name:"Dingen die prikken", words:["Cactus","Naald","Wesp","Brandnetel"]},
      {id:3, name:"Werkwoorden zonder de G", words:["Rillen","Luren","Raaien","Okken"]}
    ]
  },
  {
    title:"Puzzel 2",
    categories:[
      {id:0, name:"Staatsvormen", words:["Monarchie","Republiek","Theocratie","Dictatuur"]},
      {id:1, name:"Gebruiksvoorwerpen met batterijen", words:["Klok","Rookmelder","Afstandsbediening","Weegschaal"]},
      {id:2, name:"Nieuwssites", words:["Nu","Nos","Ad","Fd"]},
      {id:3, name:"Afkortingen van Nederlandse provincies", words:["Gr","Dr","Nh","Ut"]}
    ]
  },
  {
    title:"Puzzel 3",
    categories:[
      {id:0, name:"Hoofd, schouders, knie en teen", words:["Hoofd","Schouders","Knie","Teen"]},
      {id:1, name:"Teletubbie personages", words:["Tinky Winky","Po","Laa-Laa","Dipsy"]},
      {id:2, name:"Eindigend op -knop", words:["Aan-uit","Volume","Deur","Bloem"]},
      {id:3, name:"Beroemde Michaels", words:["Jordan","Jackson","J Fox","Caine"]}
    ]
  },
  {
    title:"Puzzel 4",
    categories:[
      {id:0, name:"Woorden met een dier in de tweede lettergreep", words:["Angsthaas","Suikerspin","Motormuis","Kitkat"]},
      {id:1, name:"Tennistermen", words:["Ace","Love","Set","Deuce"]},
      {id:2, name:"Woorden die 'twee' betekenen", words:["Paar","Duo","Koppel","Stel"]},
      {id:3, name:"Woorden te combineren met Goud-", words:["Vis","Smid","A","Mijn"]}
    ]
  },
  {
    title:"Puzzel 5",
    categories:[
      {id:0, name:"Woorden met een umlaut", words:["Uberhaupt","Fohn","Knackebrod","Rosti"]},
      {id:1, name:"Palindromen", words:["Kajak","Level","Radar","Solos"]},
      {id:2, name:"Eindigend op -band", words:["Rock","Horloge","Video","Breed"]},
      {id:3, name:"Hansen", words:["Teeuwen","Wiegel","Kazàn","Klok"]}
    ]
  },
  {
    title:"Puzzel 6",
    categories:[
      {id:0, name:"Dingen die je kunt wassen", words:["Auto","Hond","Raam","Haar"]},
      {id:1, name:"Woorden voor 'niets'", words:["Niks","Noppes","Nada","Nul"]},
      {id:2, name:"Woorden vóór -fiets", words:["Brom","Race","Deel","Vouw"]},
      {id:3, name:"Uitroepen", words:["Ah","Ai","Oef","Pff"]}
    ]
  },
];

let currentPuzzle=0,tiles=[],selected=[],lives=4,solvedCats=[],gameOver=false;

function initPuzzle(idx){
  currentPuzzle=idx;
  tiles=[];
  PUZZLES[idx].categories.forEach(cat=>{
    cat.words.forEach(w=>tiles.push({word:w,catId:cat.id,catName:cat.name}));
  });
  shuffle(tiles);
  selected=[];lives=4;solvedCats=[];gameOver=false;
  render();
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

function render(){
  document.getElementById('puzzle-nr').textContent=PUZZLES[currentPuzzle].title+' / '+PUZZLES.length;
  renderLives();renderSolved();renderGrid();renderBtns();
  document.getElementById('msg').textContent='';
}

function renderLives(){
  const c=document.getElementById('lives');
  c.innerHTML='';
  for(let i=0;i<4;i++){
    const s=document.createElement('span');
    s.textContent=i<lives?'❤️':'🖤';
    c.appendChild(s);
  }
}

function renderSolved(){
  const c=document.getElementById('solved-area');
  c.innerHTML='';
  solvedCats.forEach(cat=>{
    const row=document.createElement('div');
    row.className='solved-row cat-'+cat.id;
    const label=document.createElement('div');
    label.className='cat-label';
    label.textContent=cat.name;
    const words=document.createElement('div');
    words.className='cat-words';
    words.textContent=cat.words.join(', ');
    row.appendChild(label);
    row.appendChild(words);
    c.appendChild(row);
  });
}

function renderGrid(){
  const g=document.getElementById('grid');
  g.innerHTML='';
  tiles.forEach((t,i)=>{
    const el=document.createElement('div');
    el.className='tile'+(selected.includes(i)?' sel':'');
    el.textContent=t.word;
    el.dataset.idx=i;
    if(!gameOver)el.onclick=()=>toggleTile(i);
    g.appendChild(el);
  });
}

function renderBtns(){
  const c=document.getElementById('btns');
  c.innerHTML='';
  if(!gameOver){
    const sd=document.createElement('button');
    sd.textContent='Deselecteer';
    sd.onclick=()=>{selected=[];renderGrid();};
    c.appendChild(sd);
    const sh=document.createElement('button');
    sh.textContent='Schud';
    sh.onclick=()=>{shuffle(tiles);selected=[];renderGrid();};
    c.appendChild(sh);
    const rn=document.createElement('button');
    rn.textContent='Willekeurige puzzel';
    rn.onclick=randomPuzzle;
    c.appendChild(rn);
  } else {
    const nx=document.createElement('button');
    nx.textContent='Volgende puzzel →';
    nx.className='btn-primary';
    nx.onclick=()=>initPuzzle((currentPuzzle+1)%PUZZLES.length);
    c.appendChild(nx);
    const rn=document.createElement('button');
    rn.textContent='Willekeurige puzzel';
    rn.onclick=randomPuzzle;
    c.appendChild(rn);
  }
}

function randomPuzzle(){
  const opties=PUZZLES.map((_,i)=>i).filter(i=>i!==currentPuzzle);
  initPuzzle(opties[Math.floor(Math.random()*opties.length)]);
}

function toggleTile(i){
  if(gameOver)return;
  const idx=selected.indexOf(i);
  if(idx>=0){
    selected.splice(idx,1);
    renderGrid();
  } else if(selected.length<4){
    selected.push(i);
    if(selected.length===4){
      renderGrid();
      setTimeout(submit,300);
    } else {
      renderGrid();
    }
  }
}

function setMsg(txt,color){
  const el=document.getElementById('msg');
  el.textContent=txt;
  el.style.color=color||'#1a1a1a';
}

function submit(){
  if(gameOver||selected.length!==4)return;
  const selWords=selected.map(i=>tiles[i]);
  const catIds=selWords.map(t=>t.catId);
  const allSame=catIds.every(c=>c===catIds[0]);
  if(allSame){
    const catDef=PUZZLES[currentPuzzle].categories.find(c=>c.id===catIds[0]);
    solvedCats.push({id:catDef.id,name:catDef.name,words:catDef.words});
    tiles=tiles.filter((_,i)=>!selected.includes(i));
    selected=[];
    setMsg('Goed zo! ✓','#1B5E1B');
    renderSolved();renderGrid();renderLives();
    if(tiles.length===0){
      gameOver=true;
      setMsg('Gefeliciteerd! Alle categorieën gevonden! 🎉','#534AB7');
      renderBtns();
    }
  } else {
    lives--;
    const counts={};
    catIds.forEach(c=>counts[c]=(counts[c]||0)+1);
    const oneAway=Object.values(counts).some(v=>v===3);
    const tileDivs=document.querySelectorAll('.tile');
    selected.forEach(i=>{
      const el=Array.from(tileDivs).find(el=>parseInt(el.dataset.idx)===i);
      if(el){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),400);}
    });
    setMsg(oneAway?'Eén af! Bijna goed...':'Niet correct, probeer het opnieuw',oneAway?'#BA7517':'#A32D2D');
    selected=[];
    renderLives();
    renderGrid();
    if(lives===0){
      gameOver=true;
      const remaining=PUZZLES[currentPuzzle].categories.filter(c=>!solvedCats.find(s=>s.id===c.id));
      remaining.forEach(cat=>solvedCats.push({id:cat.id,name:cat.name,words:cat.words}));
      tiles=[];
      setMsg('Game over! Dit waren de antwoorden:','#A32D2D');
      renderSolved();renderGrid();renderBtns();
    }
  }
}

initPuzzle(0);
</script>
</body>
</html>
