<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connecties</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --tile-default: #f4f4f0;      /* Zacht crème/grijs conform Connections */
            --tile-selected: #5a5954;     /* Elegant donkergrijs voor selectie */
            --tile-selected-text: #ffffff;
            
            /* Gedempte premium pastelkleuren */
            --cat-0: #f9df6d; /* Warm Geel */
            --cat-1: #a0c35a; /* Comfortabel Groen */
            --cat-2: #b0c4de; /* Kalm Blauw */
            --cat-3: #ba55d3; /* Koningspaars */
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Ruimte natuurlijk opbouwen vanaf de bovenkant */
            box-sizing: border-box;
            padding: 3vh 16px;
        }

        .header-container {
            text-align: center;
            width: 100%;
            margin-bottom: 2vh;
        }

        h1 {
            margin: 0 0 4px 0;
            font-size: 3.8vh;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .instructions {
            color: #5a5954;
            margin: 0;
            font-size: 1.8vh;
            font-weight: 400;
        }

        .status-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 500px;
            width: 100%;
            margin-bottom: 2vh;
            font-size: 1.9vh;
            color: #333;
            box-sizing: border-box;
            padding: 0 4px;
            border-bottom: 1px solid #e6e6e6;
            padding-bottom: 8px;
        }

        #level-display {
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #666;
        }

        #lives-box {
            font-weight: 500;
        }

        .heart {
            color: #d32f2f;
            margin: 0 1px;
        }

        .heart.lost {
            color: #e0e0e0;
        }

        #game-container {
            max-width: 500px;
            width: 100%;
            margin-bottom: 2vh;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px; /* Iets meer ademruimte tussen de tegels */
            container-type: inline-size;
        }

        .tile {
            height: 9.5vh;
            background-color: var(--tile-default);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.15s, color 0.15s, transform 0.1s;
            text-align: center;
            padding: 6px;
            box-sizing: border-box;
            border: 3px solid transparent;
            overflow: hidden;
            letter-spacing: -0.2px;
            
            white-space: normal !important;
            word-break: normal !important;
            word-wrap: break-word !important;
            
            font-size: 3.8cqw; 
            line-height: 1.2;
        }

        /* Subtiel schaaleffect bij tikken op mobiel */
        .tile:active {
            transform: scale(0.97);
        }

        .tile.selected {
            background-color: var(--tile-selected);
            color: var(--tile-selected-text);
        }

        .tile.correct-blink {
            border-color: #4CAF50 !important;
            background-color: #e8f5e9 !important;
            color: #4CAF50 !important;
        }

        .tile.wrong-blink {
            border-color: #f44336 !important;
            animation: shake 0.3s ease-in-out;
        }

        .solved-row {
            grid-column: span 4;
            height: 9.5vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-weight: bold;
            padding: 6px;
            box-sizing: border-box;
            text-align: center;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        .solved-row .category-title {
            font-size: 4.0cqw;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
            color: #000000;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .solved-row .category-words {
            font-size: 3.4cqw;
            font-weight: 500;
            color: #222222;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bottom-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2vh;
            margin-top: auto; /* Duwt de knoppen netjes naar de biologische onderkant */
            padding-bottom: 1vh;
        }

        #message {
            font-weight: 700;
            height: 3vh;
            text-align: center;
            font-size: 2vh;
            letter-spacing: -0.2px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
        }

        button {
            background-color: transparent;
            border: 1px solid #a3a39f;
            color: #000000;
            padding: 1.6vh 0;
            border-radius: 24px;
            font-size: 1.9vh;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            flex: 1;
            max-width: 220px;
            transition: background-color 0.15s, border-color 0.15s;
        }

        button:hover {
            background-color: #f4f4f0;
        }

        #random-btn {
            border-color: #cbd5e1;
            color: #64748b; /* Rustige kleur zodat het de primaire gameplay niet stoort */
        }

        #random-btn:hover {
            background-color: #f8fafc;
            border-color: #94a3b8;
        }

        #next-btn {
            background-color: #000000; /* Solide zwart accent voor de actieknop */
            color: #ffffff;
            border: none;
            display: none;
            max-width: 260px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        #next-btn:hover {
            background-color: #222222;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        @keyframes popIn {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Desktop optimalisatie */
        @media (min-width: 600px) {
            body { padding: 5vh 20px; justify-content: center; }
            .header-container { margin-bottom: 30px; }
            h1 { font-size: 36px; }
            .instructions { font-size: 16px; }
            .status-container { font-size: 16px; margin-bottom: 25px; }
            #grid { gap: 10px; }
            .tile { height: 84px; font-size: 14px !important; white-space: nowrap !important; } 
            .solved-row { height: 84px; }
            .solved-row .category-title { font-size: 14px; }
            .solved-row .category-words { font-size: 13px; }
            button { padding: 14px 0; font-size: 15px; border-radius: 28px; }
            #message { font-size: 16px; }
            .bottom-container { margin-top: 20px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Verbindingen</h1>
        <p class="instructions">Maak groepen van 4 woorden die een centrale link hebben.</p>
    </div>

    <div class="status-container">
        <div id="level-display">Puzzel 1 / 5</div>
        <div id="lives-box">Levens: <span id="hearts-display">❤️ ❤️ ❤️ ❤️</span></div>
    </div>

    <div id="game-container">
        <div id="grid"></div>
    </div>

    <div class="bottom-container">
        <div id="message"></div>
        <div class="button-container">
            <button id="shuffle-btn">Husselen</button>
            <button id="random-btn">Willekeurige puzzel</button>
            <button id="next-btn">Volgende puzzel</button>
        </div>
    </div>

    <script>
        var allePuzzelsData = {
            1: [
                { id: 0, categorie: "Dingen die (vaak) geel zijn", woorden: ["Banaan", "Taxi", "Kanarie", "Badeend"] },
                { id: 1, categorie: "Onvrijwillige acties", woorden: ["Niezen", "Blozen", "Braken", "Hoesten"] },
                { id: 2, categorie: "Dingen die prikken", woorden: ["Cactus", "Naald", "Wesp", "Brandnetel"] },
                { id: 3, categorie: "Werkwoorden zonder de G", woorden: ["Rillen", "Luren", "Raaien", "Okken"] }
            ],
            2: [
                { id: 0, categorie: "Staatsvormen", woorden: ["Monarchie", "Republiek", "Theocratie", "Dictatuur"] },
                { id: 1, categorie: "Gebruiksvoorwerpen met batterijen", woorden: ["Klok", "Rookmelder", "Afstandsbediening", "Weegschaal"] },
                { id: 2, categorie: "Nieuwssites", woorden: ["Nu", "Nos", "Ad", "Fd"] },
                { id: 3, categorie: "Afkortingen van Nederlandse provincies", woorden: ["Gr", "Dr", "Nh", "Ut"] }
            ],
            3: [
                { id: 0, categorie: "Hoofd, schouders, knie en teen", woorden: ["Hoofd", "Schouders", "Knie", "Teen"] },
                { id: 1, categorie: "Teletubbie personages", woorden: ["Tinky Winky", "Po", "Laa-Laa", "Dipsy"] },
                { id: 2, categorie: "Eindigend op -knop", woorden: ["Aan-uit", "Volume", "Deur", "Bloem"] },
                { id: 3, categorie: "Beroemde Michaels", woorden: ["Jordan", "Jackson", "J Fox", "Caine"] }
            ],
            4: [
                { id: 0, categorie: "Woorden met een dier in de tweede lettergreep", woorden: ["Angsthaas", "Suikerspin", "Motormuis", "Kitkat"] },
                { id: 1, categorie: "Tennistermen", woorden: ["Ace", "Love", "Set", "Deuce"] },
                { id: 2, categorie: "Woorden die 'twee' betekenen", woorden: ["Paar", "Duo", "Koppel", "Stel"] },
                { id: 3, categorie: "Woorden te combineren met Goud-", woorden: ["Vis", "Smid", "A", "Mijn"] }
            ],
            5: [
                { id: 0, categorie: "Woorden met een umlaut", woorden: ["Uberhaupt", "Fohn", "Knackebrod", "Rosti"] },
                { id: 1, categorie: "Palindromen", woorden: ["Kajak", "Level", "Radar", "Solos"] },
                { id: 2, categorie: "Eindigend op -band", woorden: ["Rock", "Horloge", "Video", "Breed"] },
                { id: 3, categorie: "Hansen", woorden: ["Teeuwen", "Wiegel", "Kazàn", "Klok"] }
            ]
        };

        var aantalPuzzels = 5;
        var actievePuzzelId = 1;
        
        var actievePuzzelData = [];
        var alleWoorden = [];
        var geselecteerdeWoorden = [];
        var geradenCategorieen = [];
        var maxLevens = 4;
        var resterendeLevens = 4;
        var blokkeerInvoer = false;

        var gridElement = document.getElementById('grid');
        var shuffleBtn = document.getElementById('shuffle-btn');
        var randomBtn = document.getElementById('random-btn');
        var nextBtn = document.getElementById('next-btn');
        var messageElement = document.getElementById('message');
        var heartsDisplay = document.getElementById('hearts-display');
        var levelDisplay = document.getElementById('level-display');

        function updateStatusWeergave() {
            levelDisplay.textContent = "Puzzel " + actievePuzzelId + " / " + aantalPuzzels;
            var hartenHtml = "";
            for (var i = 0; i < maxLevens; i++) {
                if (i < resterendeLevens) {
                    hartenHtml += "❤️ ";
                } else {
                    hartenHtml += "<span class='heart lost'>🖤</span> ";
                }
            }
            heartsDisplay.innerHTML = hartenHtml.trim();
        }

        function laadPuzzel(id) {
            actievePuzzelId = id;
            actievePuzzelData = allePuzzelsData[actievePuzzelId];
            
            geselecteerdeWoorden = [];
            geradenCategorieen = [];
            resterendeLevens = maxLevens;
            blokkeerInvoer = false;
            messageElement.textContent = "";
            
            nextBtn.style.display = "none";
            shuffleBtn.style.display = "inline-block";
            randomBtn.style.display = "inline-block";
            updateStatusWeergave();

            alleWoorden = [];
            for (var c = 0; c < actievePuzzelData.length; c++) {
                var cat = actievePuzzelData[c];
                for (var w = 0; w < cat.woorden.length; w++) {
                    alleWoorden.push({ tekst: cat.woorden[w], catId: cat.id });
                }
            }

            alleWoorden = husselEcht(alleWoorden);
            bouwGridEersteKeer();
        }

        function speelWillekeurigeAnderePuzzel() {
            if (blokkeerInvoer) return;
            
            var opties = [];
            for (var i = 1; i <= aantalPuzzels; i++) {
                if (i !== actievePuzzelId) {
                    opties.push(i);
                }
            }
            
            var randomId = opties[Math.floor(Math.random() * opties.length)];
            laadPuzzel(randomId);
        }

        function husselEcht(array) {
            var gehuppeld = [].concat(array);
            var pogingen = 0;
            
            while (pogingen < 100) {
                for (var i = gehuppeld.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var temp = gehuppeld[i];
                    gehuppeld[i] = gehuppeld[j];
                    gehuppeld[j] = temp;
                }

                var teVeelOpRij = false;
                for (var i = 0; i < gehuppeld.length - 2; i++) {
                    if (gehuppeld[i].catId === gehuppeld[i+1].catId && gehuppeld[i].catId === gehuppeld[i+2].catId) {
                        teVeelOpRij = true;
                        break;
                    }
                }

                if (!teVeelOpRij) {
                    break;
                }
                pogingen++;
            }
            return gehuppeld;
        }

        function bouwGridEersteKeer() {
            gridElement.innerHTML = '';
            
            for (var g = 0; g < geradenCategorieen.length; g++) {
                var catId = geradenCategorieen[g];
                var cat = vindCategoriePerId(catId);
                if (cat) {
                    var row = createSolvedRowElement(cat);
                    gridElement.appendChild(row);
                }
            }

            for (var w = 0; w < alleWoorden.length; w++) {
                var woordObj = alleWoorden[w];
                if (geradenCategorieen.indexOf(woordObj.catId) > -1) continue;

                var tile = createTileElement(woordObj);
                gridElement.appendChild(tile);
            }
        }

        function findCategoriePerId(catId) {
            for (var c = 0; c < actievePuzzelData.length; c++) {
                if (actievePuzzelData[c].id === catId) return actievePuzzelData[c];
            }
            return null;
        }

        function createSolvedRowElement(cat) {
            var row = document.createElement('div');
            row.className = "solved-row";
            row.style.backgroundColor = "var(--cat-" + cat.id + ")";
            row.innerHTML = "<div class='category-title'>" + cat.categorie + "</div><div class='category-words'>" + cat.woorden.join(', ') + "</div>";
            return row;
        }

        function createTileElement(woordObj) {
            var tile = document.createElement('div');
            tile.className = 'tile';
            
            var len = woordObj.tekst.length;
            if (window.innerWidth < 600) {
                if (len >= 14) {
                    tile.style.fontSize = '2.8cqw';
                } else if (len >= 10) {
                    tile.style.fontSize = '3.2cqw';
                }
            }
            
            tile.id = haalGezuiverdeId(woordObj.tekst);
            tile.textContent = woordObj.tekst;
            tile.woordData = woordObj;

            tile.addEventListener('click', function() {
                if (!blokkeerInvoer) KlikOpWoord(woordObj, tile);
            });
            return tile;
        }

        function haalGezuiverdeId(tekst) {
            return 'tile-' + tekst.replace(/[^a-zA-Z0-9]/g, '-');
        }

        function KlikOpWoord(woordObj, tileElement) {
            if (resterendeLevens <= 0 || blokkeerInvoer) return;
            messageElement.textContent = "";
            
            var index = geselecteerdeWoorden.indexOf(woordObj);
            
            if (index > -1) {
                geselecteerdeWoorden.splice(index, 1);
                tileElement.classList.remove('selected');
            } else {
                if (geselecteerdeWoorden.length < 4) {
                    geselecteerdeWoorden.push(woordObj);
                    tileElement.classList.add('selected');
                    
                    if (geselecteerdeWoorden.length === 4) {
                        setTimeout(controleerSelectie, 200);
                    }
                }
            }
        }

        function controleerSelectie() {
            blokkeerInvoer = true;
            var eersteCatId = geselecteerdeWoorden[0].catId;
            
            var allesCorrect = true;
            for (var i = 0; i < geselecteerdeWoorden.length; i++) {
                if (geselecteerdeWoorden[i].catId !== eersteCatId) {
                    allesCorrect = false;
                    break;
                }
            }

            var geselecteerdeElementen = [];
            for (var i = 0; i < geselecteerdeWoorden.length; i++) {
                var el = document.getElementById(haalGezuiverdeId(geselecteerdeWoorden[i].tekst));
                if (el) geselecteerdeElementen.push(el);
            }

            if (allesCorrect) {
                for (var e = 0; e < geselecteerdeElementen.length; e++) {
                    geselecteerdeElementen[e].classList.remove('selected');
                    geselecteerdeElementen[e].classList.add('correct-blink');
                }

                setTimeout(function() {
                    geradenCategorieen.push(eersteCatId);
                    geselecteerdeWoorden = [];
                    blokkeerInvoer = false;
                    
                    if (geradenCategorieen.length === 4) {
                        messageElement.textContent = "Goed gedaan! 🎉";
                        messageElement.style.color = "green";
                        toonEindFaseKnoppen();
                    }
                    bouwGridEersteKeer();
                }, 800);

            } else {
                resterendeLevens--;
                updateStatusWeergave();

                for (var e = 0; e < geselecteerdeElementen.length; e++) {
                    geselecteerdeElementen[e].classList.add('wrong-blink');
                }
                
                if (resterendeLevens <= 0) {
                    messageElement.textContent = "Game Over! 😢";
                    messageElement.style.color = "#d32f2f";
                    
                    setTimeout(function() {
                        geradenCategorieen = [0, 1, 2, 3];
                        geselecteerdeWoorden = [];
                        bouwGridEersteKeer();
                        toonEindFaseKnoppen();
                    }, 1200);
                } else {
                    messageElement.textContent = "Onjuiste combinatie.";
                    messageElement.style.color = "#000000";
                    
                    setTimeout(function() {
                        for (var e = 0; e < geselecteerdeElementen.length; e++) {
                            geselecteerdeElementen[e].classList.remove('selected', 'wrong-blink');
                        }
                        geselecteerdeWoorden = [];
                        blokkeerInvoer = false;
                    }, 1000);
                }
            }
        }

        function toonEindFaseKnoppen() {
            shuffleBtn.style.display = "none";
            randomBtn.style.display = "none";
            nextBtn.style.display = "inline-block";
        }

        function gaNaarVolgendePuzzel() {
            var volgendeId = actievePuzzelId + 1;
            if (volgendeId > aantalPuzzels) {
                volgendeId = 1;
            }
            laadPuzzel(volgendeId);
        }

        shuffleBtn.addEventListener('click', function() {
            if (blokkeerInvoer || resterendeLevens <= 0) return;
            alleWoorden = husselEcht(alleWoorden);
            bouwGridEersteKeer();
        });

        randomBtn.addEventListener('click', function() {
            speelWillekeurigeAnderePuzzel();
        });

        nextBtn.addEventListener('click', function() {
            gaNaarVolgendePuzzel();
        });

        laadPuzzel(1);
    </script>
</body>
</html>
