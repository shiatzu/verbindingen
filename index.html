<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Woordverbindingen Spel - 10 Puzzels</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --tile-default: #efefe6;
            --tile-selected: #5a5a5a;
            --tile-selected-text: #ffffff;
            --cat-0: #f9df6d; /* Geel */
            --cat-1: #a0c35a; /* Groen */
            --cat-2: #b0c4de; /* Blauw */
            --cat-3: #ba55d3; /* Paars */
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            margin-bottom: 5px;
        }

        .instructions {
            color: #666;
            margin-bottom: 15px;
            text-align: center;
        }

        .selector-container {
            margin-bottom: 20px;
            font-size: 16px;
        }

        select {
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background-color: #fff;
            cursor: pointer;
        }

        #game-container {
            max-width: 600px;
            width: 100%;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .tile {
            aspect-ratio: 1 / 1;
            background-color: var(--tile-default);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s, color 0.2s;
            text-align: center;
            padding: 5px;
        }

        .tile.selected {
            background-color: var(--tile-selected);
            color: var(--tile-selected-text);
        }

        .solved-row {
            grid-column: span 4;
            height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-weight: bold;
            animation: popIn 0.3s ease-out;
        }

        .solved-row .category-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .solved-row .category-words {
            font-size: 12px;
            font-weight: normal;
            opacity: 0.9;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            background-color: transparent;
            border: 1px solid #ccc;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background-color: #f5f5f5;
        }

        #message {
            font-weight: bold;
            height: 25px;
            text-align: center;
            color: #d32f2f;
            font-size: 16px;
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>Verbandle Kloon</h1>
    <p class="instructions">Maak groepen van 4 woorden die een centrale link hebben.</p>

    <div class="selector-container">
        <label for="puzzel-select">Kies een puzzel: </label>
        <select id="puzzel-select"></select>
    </div>

    <div id="game-container">
        <div id="grid"></div>
        <div class="button-container">
            <button id="shuffle-btn">Husselen</button>
        </div>
        <div id="message"></div>
    </div>

    <script>
        const allePuzzels = {
            1: [
                { id: 0, categorie: "Dingen die (vaak) geel zijn", woorden: ["Banaan", "Taxi", "Kanarie", "Badeend"] },
                { id: 1, categorie: "Onvrijwillige acties", woorden: ["Niezen", "Blozen", "Braken", "Hoesten"] },
                { id: 2, categorie: "Dingen die prikken", woorden: ["Cactus", "Naald", "Wesp", "Brandnetel"] },
                { id: 3, categorie: "Werkwoorden zonder de G", woorden: ["Rillen", "Luren", "Raaien", "Okken"] }
            ],
            2: [
                { id: 0, categorie: "Fruitsoorten", woorden: ["Appel", "Banaan", "Peer", "Kers"] },
                { id: 1, categorie: "Huisdieren", woorden: ["Hond", "Kat", "Goudvis", "Hamster"] },
                { id: 2, categorie: "Kleuren", woorden: ["Rood", "Blauw", "Groen", "Geel"] },
                { id: 3, categorie: "Meubels", woorden: ["Stoel", "Tafel", "Kast", "Bed"] }
            ],
            3: [
                { id: 0, categorie: "Categorie 1", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 1, categorie: "Categorie 2", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 2, categorie: "Categorie 3", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 3, categorie: "Categorie 4", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] }
            ],
            4: [
                { id: 0, categorie: "Categorie 1", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 1, categorie: "Categorie 2", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 2, categorie: "Categorie 3", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 3, categorie: "Categorie 4", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] }
            ],
            5: [
                { id: 0, categorie: "Categorie 1", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 1, categorie: "Categorie 2", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 2, categorie: "Categorie 3", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 3, categorie: "Categorie 4", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] }
            ],
            6: [
                { id: 0, categorie: "Categorie 1", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 1, categorie: "Categorie 2", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 2, categorie: "Categorie 3", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 3, categorie: "Categorie 4", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] }
            ],
            7: [
                { id: 0, categorie: "Categorie 1", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 1, categorie: "Categorie 2", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 2, categorie: "Categorie 3", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 3, categorie: "Categorie 4", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] }
            ],
            8: [
                { id: 0, categorie: "Categorie 1", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 1, categorie: "Categorie 2", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 2, categorie: "Categorie 3", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 3, categorie: "Categorie 4", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] }
            ],
            9: [
                { id: 0, categorie: "Categorie 1", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 1, categorie: "Categorie 2", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 2, categorie: "Categorie 3", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 3, categorie: "Categorie 4", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] }
            ],
            10: [
                { id: 0, categorie: "Categorie 1", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 1, categorie: "Categorie 2", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 2, categorie: "Categorie 3", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] },
                { id: 3, categorie: "Categorie 4", woorden: ["Woord1", "Woord2", "Woord3", "Woord4"] }
            ]
        };

        let huidigePuzzelId = 1;
        let actievePuzzelData = [];
        let alleWoorden = [];
        let geselecteerdeWoorden = [];
        let geradenCategorieen = [];
        let blokkeerInvoer = false;

        const gridElement = document.getElementById('grid');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const messageElement = document.getElementById('message');
        const puzzelSelect = document.getElementById('puzzel-select');

        function bouwDropdown() {
            puzzelSelect.innerHTML = '';
            Object.keys(allePuzzels).forEach(id => {
                const optie = document.createElement('option');
                optie.value = id;
                optie.textContent = `Puzzel ${id}`;
                puzzelSelect.appendChild(optie);
            });
        }

        function laadPuzzel(id) {
            huidigePuzzelId = id;
            actievePuzzelData = allePuzzels[id];
            
            geselecteerdeWoorden = [];
            geradenCategorieen = [];
            blokkeerInvoer = false;
            messageElement.textContent = "";

            alleWoorden = [];
            actievePuzzelData.forEach(cat => {
                cat.woorden.forEach(woord => {
                    alleWoorden.push({ tekst: woord, catId: cat.id });
                });
            });

            alleWoorden = husselGrondig(alleWoorden);
            bouwGrid();
        }

        function husselGrondig(array) {
            let gehuppeld = [...array];
            let isTeGeordend = true;

            while (isTeGeordend) {
                gehuppeld.sort(() => Math.random() - 0.5);
                const eersteVierGelijk = gehuppeld.slice(0, 4).every(w => w.catId === gehuppeld[0].catId);
                if (!eersteVierGelijk) {
                    isTeGeordend = false;
                }
            }
            return gehuppeld;
        }

        function bouwGrid() {
            gridElement.innerHTML = '';
            
            geradenCategorieen.forEach(catId => {
                const cat = actievePuzzelData.find(c => c.id === catId);
                const row = document.createElement('div');
                row.className = `solved-row`;
                row.style.backgroundColor = `var(--cat-${catId})`;
                row.innerHTML = `
                    <div class="category-title">${cat.categorie}</div>
                    <div class="category-words">${cat.woorden.join(', ')}</div>
                `;
                gridElement.appendChild(row);
            });

            const resterendeWoorden = alleWoorden.filter(w => !geradenCategorieen.includes(w.catId));

            resterendeWoorden.forEach(woordObj => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.textContent = woordObj.tekst;
                
                if (geselecteerdeWoorden.includes(woordObj)) {
                    tile.classList.add('selected');
                }

                tile.addEventListener('click', () => {
                    if (!blokkeerInvoer) KlikOpWoord(woordObj);
                });
                gridElement.appendChild(tile);
            });
        }

        function KlikOpWoord(woordObj) {
            messageElement.textContent = "";
            const index = geselecteerdeWoorden.indexOf(woordObj);
            
            if (index > -1) {
                geselecteerdeWoorden.splice(index, 1);
                bouwGrid();
            } else {
                if (geselecteerdeWoorden.length < 4) {
                    geselecteerdeWoorden.push(woordObj);
                    bouwGrid();
                    
                    if (geselecteerdeWoorden.length === 4) {
                        controleerSelectie();
                    }
                }
            }
        }

        function controleerSelectie() {
            blokkeerInvoer = true;
            const eersteCatId = geselecteerdeWoorden[0].catId;
            const allesCorrect = geselecteerdeWoorden.every(w => w.catId === eersteCatId);

            if (allesCorrect) {
                geradenCategorieen.push(eersteCatId);
                geselecteerdeWoorden = [];
                blokkeerInvoer = false;
                
                if (geradenCategorieen.length === 4) {
                    messageElement.textContent = "Gefeliciteerd! Je hebt deze puzzel opgelost! 🎉";
                    messageElement.style.color = "green";
                }
                bouwGrid();
            } else {
                messageElement.textContent = "Onjuiste combinatie, probeer het opnieuw.";
                messageElement.style.color = "var(--text-color)";
                
                setTimeout(() => {
                    geselecteerdeWoorden = [];
                    blokkeerInvoer = false;
                    bouwGrid();
                }, 1000);
            }
        }

        shuffleBtn.addEventListener('click', () => {
            if (blokkeerInvoer) return;
            alleWoorden = husselGrondig(alleWoorden);
            bouwGrid();
        });

        puzzelSelect.addEventListener('change', (e) => {
            laadPuzzel(e.target.value);
        });

        bouwDropdown();
        laadPuzzel(1);
    </script>
</body>
</html>
